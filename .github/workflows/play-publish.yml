name: Publish Play Internal

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track (internal, alpha, beta, production)
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  play:
    name: Build AAB and upload
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sed -i '10i\
          \
              ndkVersion = "29.0.14206865"' "${{ github.workspace }}/V2rayNG/app/build.gradle.kts"

      - name: Ensure native deps
        run: |
          if [ ! -d hev-socks5-tunnel/.git ]; then
            git clone --recursive --depth 1 https://github.com/heiher/hev-socks5-tunnel hev-socks5-tunnel
          fi
          if [ ! -d AndroidLibXrayLite/.git ]; then
            git clone https://github.com/2dust/AndroidLibXrayLite AndroidLibXrayLite
          fi
          CURRENT_TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          curl -fsSL -o V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${CURRENT_TAG}/libv2ray.aar"
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Decode signing keystore
        uses: timheuer/base64-to-file@v2.0.0
        id: android_keystore
        continue-on-error: true
        with:
          fileName: android_keystore.jks
          encodedString: ${{ secrets.APP_KEYSTORE_BASE64 }}

      - name: Build Play Store AAB
        env:
          KS_PATH: ${{ steps.android_keystore.outputs.filePath }}
          KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          cd "${{ github.workspace }}/V2rayNG"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          if [ -n "${KS_PATH}" ] && [ -f "${KS_PATH}" ]; then
            ./gradlew :app:bundlePlaystoreRelease \
              -Pandroid.injected.signing.store.file="${KS_PATH}" \
              -Pandroid.injected.signing.store.password="${KS_PASS}" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${KEY_PASS}"
          else
            ./gradlew :app:bundlePlaystoreRelease
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: sumrak-play-aab
          path: V2rayNG/app/build/outputs/bundle/playstoreRelease/*.aab
          if-no-files-found: error

      - name: Upload to Play (fastlane)
        env:
          PLAY_JSON_B64: ${{ secrets.PLAY_STORE_JSON_BASE64 }}
          SUPPLY_TRACK: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track || 'internal' }}
        run: |
          if [ -z "${PLAY_JSON_B64}" ]; then
            echo "PLAY_STORE_JSON_BASE64 is not set — AAB saved as artifact only."
            exit 0
          fi
          echo "${PLAY_JSON_B64}" | base64 -d > "${{ github.workspace }}/fastlane/play-store-credentials.json"
          gem install fastlane -N --no-document
          fastlane run upload_to_play_store \
            track:"${SUPPLY_TRACK}" \
            aab:"${{ github.workspace }}/V2rayNG/app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab" \
            package_name:"com.sumrax.app" \
            json_key:"${{ github.workspace }}/fastlane/play-store-credentials.json" \
            metadata_path:"${{ github.workspace }}/fastlane/metadata/android" \
            skip_upload_apk:true \
            skip_upload_metadata:false \
            skip_upload_images:true \
            skip_upload_screenshots:true