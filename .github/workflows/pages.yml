name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy docs to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: IndexNow (Bing, Yandex, Naver)
        if: success()
        run: |
          BASE="https://yaylymchik.github.io/Sumrak-VPN-v2ray-TM-Dealler"
          KEY="a7f3c9e2b8416d50sumrakVpnIndexNow2026"
          curl -fsS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"yaylymchik.github.io\",\"key\":\"${KEY}\",\"keyLocation\":\"${BASE}/sumrak-indexnow-key.txt\",\"urlList\":[\"${BASE}/\",\"${BASE}/sitemap.xml\"]}" \
            || true